<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 5</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        nav{
            position: sticky;
            top: 0;
        }

        ul {
            display: flex;  
            gap: 12px;
            background-color: blueviolet;
            padding: 0px 19px;
            justify-content: center;
        }

        ul li {
            list-style: none;
            padding: 18px 26px;
            cursor: pointer;
            font-size: 24px;
        }

        ul li a {
            color: aliceblue;
            text-decoration: none;
        }

        #logo{
            border-radius: 50%;
            height: 85px;
            width: 85px;
            position: fixed;
            
            right: 2%;
            bottom: 4%;
            
        }

        .container{
            padding: 35px;
            margin: 28px 32px;
            display: flex;
            background-color: aqua;
            height: 550px;
            gap: 34px;
            border: 2px solid black;
            align-items: center;
        }

        .box1, .box2{
            padding: 50px;
            height: 450px;
            width: 850px;
            border: 2px solid black;
        }

        .box1{
            background-color: blue;        
        }

        .box2{
            background-color: rgb(0, 255, 183);
        }

        .desc{
            margin: 45px 60px;
            width: 60vw auto;
            border: 3px solid black;
            border-radius: 45px;
            text-align: center;
            font-size: 56px;
        }

        footer{
            padding: 12px 25px;
            text-align: center;
            font-size: 25px;
            background-color: rgba(243, 172, 86, 0.77);
            border: 2px solid black;
        }
    </style>
</head>

<body>
    <nav>
