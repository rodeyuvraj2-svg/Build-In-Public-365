<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 5</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }

        header{
            position: sticky;
            top: 0;
        }
        
        nav{
            background-color: pink;
            height: 36px;
        }

        .container{
            background-color: green;
            margin: 12px 16px;
            text-align: center;
            padding: 23px 23px;
        }

        main{
            background-color: black;
            color: white;
            padding: 12px;
        }

        .box1{
            background-color: orange;
            border: 2px solid rgb(119, 118, 118);
            height: 60vh;
            width: 45%;
            display: inline-block;
        }

        .box2{
            background-color: aqua;
            border: 2px solid rgb(119, 118, 118);
            height: 60vh;
            width: 45%;
            display: inline-block;
            margin: 0px 12px;
        }

        .text-box{
            padding: 34px;
            border: 2px solid white;
            text-align: center;
            background-color: black;
            margin: 18px 55px;
            border-radius: 16px;
        }

        footer{
            background-color: bisque;
            height: 36px;
        }
        
        .logo{
            height: 38px;
            width: 38px;
            border-radius: 50%;
            background-color: aquamarine;
            position: fixed;
            border: 1px solid white;
            right: 23px;
            bottom: 12px;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            
        </nav>
    </header>

    <main>
        <div class="container">
            <div class="box1"></div>
            <div class="box2"></div>
        </div>
        <div class="text-box">
            <p>Welcome to Sigma Web Development Course</p>
        </div>
        <div class="logo"></div>
    </main>

    <footer>

    </footer>
</body>
</html>
