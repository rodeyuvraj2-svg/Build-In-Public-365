<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 4</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tiny5+Duo:ital,wght@0,100..900;1,100..900&display=swap');
    </style>
    <style>
        :root {
            --primary-color: rgb(128, 0, 255);
            --secondary-color: rgb(179, 116, 243);
            --text-color: white;
        }

        * {
            padding: 0;
            margin: 0;
        }

        body {
            font-family: "Tiny5 Duo", sans-serif;
            background-color: var(--secondary-color);
        }

        nav {
            background-color: var(--primary-color);
            padding: 12px 12px;
        }

        ul li{
            display: inline;
            padding: 16px;
            list-style: none;
            cursor: pointer;
        }
        
        ul li a{
            color: var(--text-color);
            text-decoration: none;
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/">About</a></li>
                <li><a href="/">Contact us</a></li>
                <li><a href="/">Services</a></li>
            </ul>
        </nav>
    </header>
</body>

</html>
