<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card challenge</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="card">
        <img id="photo" src="https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fsmdistribution.co%2Fwp-content%2Fuploads%2F2021%2F02%2Fsony-wireless-headphones-1.jpg&f=1&nofb=1&ipt=dd5689f8f2027acfe32f71606e58f94e43b7aa4ba6f34609c1a64606de35b03e&ipo=images"
            alt="headphone">
        <div class="tag">
            <span class="s1">Electronics</span>
            <span class="s2">⭐4.8 (120 reviews)</span>
        </div>
        <h2 id="title">Wireless Headphones</h2>
        <p id="desc">Enjoy crystal-clear sound, deep bass, and comfortable listening all day long.</p>
        <div class="price">
            <span id="dis-price">$79.99</span>
            <span id="og-price">$99.99</span>
        </div>
        <button>Add to Cart</button> 
    </div>
</body>

</html>
