<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex</title>
    <style>
        .container{
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
            background-color: beige;
            gap: 10px;
        }
        div{
            width: 150px;
            height: 150px;
            background-color: rgb(3, 124, 254);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div>Box1</div>
        <div>Box2</div>
        <div>Box3</div>
    </div>
</body>
</html>
